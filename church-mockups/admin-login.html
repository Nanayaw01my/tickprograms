<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Truth Faith Rainbow Ministry</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <i class="fas fa-cross"></i>
      </div>
      <h2>Truth Faith Rainbow Ministry</h2>
      <p>Where Faith Meets Purpose</p>
    </div>

    <!-- Admin Portal Label -->
    <div class="login-subtitle">
      <span><i class="fas fa-lock" style="margin-right:8px; color:var(--gold);"></i>Admin Portal</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Enter your username"
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <i class="fas fa-eye password-toggle" id="pwToggle" onclick="togglePassword()"></i>
        </div>
      </div>

      <div class="form-footer">
        <a href="#" class="forgot-link"><i class="fas fa-question-circle"></i> Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
      </button>

    </form>

    <!-- Card Footer -->
    <div class="login-card-footer">
      <i class="fas fa-shield-alt" style="color:var(--gold); margin-right:6px;"></i>
      Secure access — authorised personnel only.<br />
      <a href="index.html" style="color:var(--purple-light); font-weight:600; font-size:0.78rem;">
        <i class="fas fa-arrow-left"></i> Back to Church Website
      </a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('pwToggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pw.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.login-btn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      btn.style.opacity = '0.8';
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1200);
    }
  </script>
</body>
</html>
